<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Until I meet You🤍</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, serif;
      background:
        radial-gradient(circle at 50% 10%, #71304f 0%, transparent 42%),
        linear-gradient(135deg, #160019, #3b0a2a, #741c3f);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      bottom: -30px;
      color: rgba(255, 190, 215, 0.65);
      animation: floatUp linear forwards;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 1; }
      to {
        transform: translateY(-110vh) rotate(35deg);
        opacity: 0;
      }
    }

    .card {
      width: 100%;
      max-width: 720px;
      padding: 48px 26px 38px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255,255,255,0.09);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.19);
      box-shadow: 0 25px 80px rgba(0,0,0,0.3);
      position: relative;
      z-index: 1;
    }

    .heart-icon {
      color: #ffc0d5;
      font-size: 30px;
      margin-bottom: 22px;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      50% { transform: scale(1.18); }
    }

    .eyebrow {
      font: 11px Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #ffc0d5;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(39px, 8vw, 68px);
      font-weight: 400;
      line-height: 1.1;
    }

    h1 span {
      display: block;
      color: #ffc0d5;
      font-style: italic;
      margin-top: 6px;
    }

    .subtitle {
      margin: 22px 0 34px;
      font-size: clamp(15px, 3vw, 18px);
      line-height: 1.7;
      color: rgba(255,255,255,0.85);
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .box {
      padding: 22px 5px;
      border-radius: 18px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,220,235,0.16);
    }

    .number {
      display: block;
      font: 300 clamp(30px, 6.5vw, 53px) Arial, sans-serif;
      font-variant-numeric: tabular-nums;
      color: #fff6fa;
    }

    .label {
      display: block;
      margin-top: 10px;
      font: 10px Arial, sans-serif;
      letter-spacing: 2px;
      color: #f5cbd9;
      text-transform: uppercase;
    }

    .date {
      margin-top: 27px;
      font: 12px Arial, sans-serif;
      letter-spacing: 2px;
      color: #ffc0d5;
    }

    .footer {
      margin-top: 30px;
      font-size: 16px;
      font-style: italic;
      color: rgba(255,255,255,0.85);
    }

    .arrival {
      display: none;
      margin-top: 30px;
      color: #ffc0d5;
      font-size: clamp(27px, 5vw, 42px);
      line-height: 1.4;
    }

    .arrival p {
      color: white;
      font: 15px/1.8 Arial, sans-serif;
      margin-top: 12px;
    }

    @media (max-width: 480px) {
      .card { padding: 38px 16px 30px; }
      .timer { gap: 7px; }
      .box { padding: 19px 2px; }
      .label { font-size: 8px; letter-spacing: 1px; }
      .date { font-size: 10px; letter-spacing: 1px; }
    }
  </style>
</head>

<body>
  <div class="hearts" id="hearts"></div>

  <main class="card">
    <div class="heart-icon">♡</div>

    <p class="eyebrow">A date with my love.</p>

    <h1>Counting down<br />to You 🤍</span></h1>

    <p class="subtitle">
      Every second brings me closer to my favorite place ...<br />
      Right next to you.
    </p>

    <section class="timer" id="timer">
      <div class="box">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </section>

    <p class="date">18 OCTOBER 2026</p>

    <div class="arrival" id="arrival">
      Finally, my favorite person. 🤍
      <p>The countdown ends. Our moment begins. ♡</p>
    </div>

    <p class="footer" id="footer">Waiting for you & me ♡</p>
  </main>

  <script>
    // 18 October 2026, 1:00 PM IST
    const targetDate =
      new Date("2026-10-18T13:00:00+05:30").getTime();

    const timer = document.getElementById("timer");
    const arrival = document.getElementById("arrival");
    const footer = document.getElementById("footer");

    function updateTimer() {
      const diff = targetDate - Date.now();

      if (diff <= 0) {
        timer.style.display = "none";
        document.querySelector(".date").style.display = "none";
        document.querySelector(".subtitle").style.display = "none";
        arrival.style.display = "block";
        footer.style.display = "none";
        return;
      }

      document.getElementById("days").textContent =
        String(Math.floor(diff / 86400000)).padStart(2, "0");

      document.getElementById("hours").textContent =
        String(Math.floor(diff / 3600000) % 24).padStart(2, "0");

      document.getElementById("minutes").textContent =
        String(Math.floor(diff / 60000) % 60).padStart(2, "0");

      document.getElementById("seconds").textContent =
        String(Math.floor(diff / 1000) % 60).padStart(2, "0");
    }

    updateTimer();
    setInterval(updateTimer, 1000);

    const hearts = document.getElementById("hearts");

    function createHeart() {
      if (document.hidden) return;

      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = Math.random() > 0.5 ? "♡" : "♥";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (14 + Math.random() * 18) + "px";
      heart.style.animationDuration = (7 + Math.random() * 6) + "s";

      hearts.appendChild(heart);
      setTimeout(() => heart.remove(), 14000);
    }

    setInterval(createHeart, 600);
  </script>
</body>
</html>
